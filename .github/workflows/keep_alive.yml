name: Keep Streamlit App & Supabase Alive

on:
  schedule:
    # Runs every 2 days
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -L -k --silent --output /dev/null --write-out "%{http_code}\n" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://institute-app-kgur4uduugergbmaxkobvn.streamlit.app/" || true
          echo "Streamlit pinged successfully!"

      - name: Ping Supabase Database
        run: |
          curl -s -X GET "https://yecyeysefehszuwdzumd.supabase.co/rest/v1/" \
            -H "apikey: public-anon-key-here" \
            -H "Authorization: Bearer public-anon-key-here" > /dev/null || true
          echo "Supabase pinged successfully!"

